[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaolvji"
version = "0.5.0"
description = "Persistent rolling parallel development controller for Codex and ZCode"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
parallel-dev = "xiaolvji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xiaolvji = ["resources/*"]
